# Builds ready-to-install files for everyone:
#   DriveDesk-<ver>-mac-arm64.dmg / -mac-x64.dmg   (macOS, Apple silicon / Intel)
#   DriveDesk-<ver>-win-x64.exe                    (Windows installer)
#   DriveDesk-Phone-<ver>.apk                      (Android)
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0 to also publish a GitHub Release.
#
# Optional secrets (builds work without them, but users see an "unidentified developer" warning):
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Stop macOS from locking the disk image (known GitHub runner issue)
        run: |
          sudo mdutil -a -i off || true          # Spotlight indexing
          for i in $(seq 1 10); do               # XProtect malware scan
            sudo pkill -9 XProtect >/dev/null 2>&1 || true
            pgrep XProtect >/dev/null || break
            sleep 3
          done
      - name: Build macOS installers
        # Signing settings are only passed on when the secrets exist; empty values break electron-builder.
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$S_CSC_LINK" ]; then
            export CSC_LINK="$S_CSC_LINK" CSC_KEY_PASSWORD="$S_CSC_KEY_PASSWORD"
            if [ -n "$S_APPLE_ID" ]; then
              export APPLE_ID="$S_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$S_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$S_APPLE_TEAM_ID"
            fi
          else
            echo "No signing certificate: building with free ad-hoc signature"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # The .dmg step occasionally fails when macOS keeps the image busy; retry up to 3 times.
          for attempt in 1 2 3; do
            if npm run dist:mac; then exit 0; fi
            echo "Build attempt $attempt failed; cleaning up and retrying"
            hdiutil detach -force /Volumes/DriveDesk >/dev/null 2>&1 || true
            sudo pkill -9 XProtect >/dev/null 2>&1 || true
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/*.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Build Windows installer
        shell: bash
        env:
          S_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$S_CSC_LINK" ]; then export CSC_LINK="$S_CSC_LINK" CSC_KEY_PASSWORD="$S_CSC_KEY_PASSWORD"; fi
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  android:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME); Gradle fetches anything missing.
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "DriveDesk-Phone-$VERSION.apk"
          else
            # Debug-signed: installs fine, but each CI build has a different key (uninstall before updating).
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "DriveDesk-Phone-$VERSION.apk"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: android/DriveDesk-Phone-*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Download the one for your device:**
            - Mac with Apple chip (M1 or newer): `DriveDesk-…-mac-arm64.dmg`
            - Mac with Intel chip: `DriveDesk-…-mac-x64.dmg`
            - Windows: `DriveDesk-…-win-x64.exe`
            - Android phone: `DriveDesk-Phone-….apk`
            Setup steps: see INSTALL.md.
