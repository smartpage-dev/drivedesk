<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DriveDesk</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="pin-screen" class="screen">
    <div class="pin-box">
      <p class="pin-title">Enter the PIN shown on your computer</p>
      <div class="pin-dots" id="pin-dots"></div>
      <p class="pin-msg" id="pin-msg" role="status"></p>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>

  <div id="stage" hidden>
    <video id="video" autoplay muted playsinline disablepictureinpicture></video>
    <div id="surface" aria-label="Remote display"></div>

    <button id="handle" aria-label="Show controls"></button>
    <div id="toolbar" hidden>
      <button data-act="mode" id="btn-mode">Touch</button>
      <button data-act="display" id="btn-display">Display</button>
      <button data-act="invert" id="btn-invert">Scroll: natural</button>
      <button data-act="stats" id="btn-stats">Stats</button>
      <button data-act="fullscreen">Full screen</button>
      <button data-act="reconnect">Reconnect</button>
      <button data-act="forget">Sign out</button>
    </div>
    <div id="stats" hidden></div>
  </div>

  <div id="status" class="screen" hidden>
    <p id="status-text">Connecting…</p>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
